name: Build and Deploy Product Table

on:
  # data/products.xlsx 를 GitHub 웹 화면에서 직접 업로드(commit)하면 자동 트리거
  push:
    branches: [main]
    paths:
      - "data/*.xlsx"
      - "scripts/convert.py"
      - "docs/index.html"
  # status.broadcom.com 상태 모아보기를 주기적으로 새로고침
  # 매일 한국시간(KST, UTC+9) 07:00 ~ 20:00 사이에만 1시간 간격으로 실행 (UTC 기준 22,23시 + 0~11시 = 하루 14회)
  # convert.py는 실제 상태(state)가 바뀔 때만 status.json을 다시 쓰므로,
  # 아무 변화가 없으면 커밋 없이 그냥 조용히 종료된다.
  schedule:
    - cron: "0 0-11,22-23 * * *"
  # 필요할 때 수동으로도 실행 가능
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Convert xlsx to JSON
        run: python scripts/convert.py

      - name: Check for changes
        id: diff
        run: |
          # docs/status.json은 실행마다 새로 생성되지 않을 수도 있으므로(변화 없으면 convert.py가 건너뜀)
          # 존재하는 파일만 골라서 스테이징한다.
          git add docs/data.json
          [ -f docs/status.json ] && git add docs/status.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated data.json / status.json
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update product data.json / broadcom status.json [skip ci]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
